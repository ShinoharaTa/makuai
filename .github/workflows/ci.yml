name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests (local D1 + dev server)
        run: npm run test:e2e

      - name: Build
        run: npm run build
