<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- 幕間 makuai: 開いた緞帳と舞台の灯り -->
	<defs>
		<clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
	</defs>
	<g clip-path="url(#r)">
		<rect width="64" height="64" fill="#16121c"/>
		<!-- 舞台の灯り -->
		<circle cx="32" cy="38" r="11" fill="#e5b567"/>
		<!-- 左の緞帳 -->
		<path d="M0 0 h22 q-7 18 -4 34 q2 16 8 30 h-26 z" fill="#e8555f"/>
		<path d="M8 0 q2 30 6 64 h-4 q-5 -34 -6 -64 z" fill="#c73e49"/>
		<!-- 右の緞帳 -->
		<path d="M64 0 h-22 q7 18 4 34 q-2 16 -8 30 h26 z" fill="#e8555f"/>
		<path d="M56 0 q-2 30 -6 64 h4 q5 -34 6 -64 z" fill="#c73e49"/>
		<!-- 上部の飾り幕 -->
		<path d="M0 0 h64 v8 q-8 5 -16 0 q-8 5 -16 0 q-8 5 -16 0 q-8 5 -16 0 z" fill="#c73e49"/>
	</g>
</svg>
